<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piatto Segreto – Votazioni</title>
<style>
:root{--gold:#ffd166;--gold2:#f4a261;--cream:#fff4e0;--line:rgba(255,209,102,.4);--ok:#5fd68a;--bad:#ff6b6b;--pink:#ff8fb1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;color:var(--cream);font:16px "Trebuchet MS","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#8a1f4a 0,transparent 50%),linear-gradient(160deg,#2a0a1b,#5b1432);background-attachment:fixed}
h1,h2{font-family:Georgia,serif;color:var(--gold);margin:.3em 0}
h1{font-size:2rem;text-align:center}
#app{max-width:34rem;margin:0 auto;padding:.8rem .9rem 2rem}
.card{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:1.1rem;padding:1rem;margin:.8rem 0}
.card.own{border:2px solid var(--ok);background:rgba(95,214,138,.12)}
.card.pt{border:2px dashed var(--pink);background:rgba(255,143,177,.1)}
label{display:block;margin:.8rem 0 .25rem;color:var(--gold);font-size:.9rem}
input{font:inherit;width:100%;padding:.8em;border-radius:.7rem;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--cream)}
.btn{font:inherit;font-weight:700;font-size:1.05rem;width:100%;border:0;border-radius:3rem;padding:.9em;margin:.4rem 0;cursor:pointer;color:#3a1200;background:linear-gradient(180deg,var(--gold),var(--gold2));box-shadow:0 .2rem 0 #b3651f}
.btn:active{transform:translateY(2px)}
.btn:focus-visible,.opt:focus-visible,.lnk:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.ghost{background:rgba(255,255,255,.12);color:var(--cream);box-shadow:none;border:1px solid var(--line)}
.btn[disabled]{opacity:.45}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;opacity:.9}
.lnk{color:var(--gold);text-decoration:underline;cursor:pointer;background:none;border:0;font:inherit;padding:.2rem}
.num{display:inline-block;background:var(--gold);color:#3a1200;font:800 1.1rem Georgia,serif;border-radius:2rem;padding:.1em .8em}
.name{font:1.7rem Georgia,serif;margin:.3rem 0}
.img{width:100%;max-height:48vh;object-fit:contain;border-radius:1rem;background:rgba(0,0,0,.3);border:2px solid var(--gold);min-height:6rem;display:block}
.pimg{max-height:60vh;min-height:12rem;margin:.5rem 0}
.opt{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;font:inherit;font-size:1.15rem;padding:.85em 1em;margin:.4rem 0;border-radius:.9rem;border:2px solid var(--line);background:rgba(255,255,255,.08);color:var(--cream);cursor:pointer}
.opt .dot{width:1.3rem;height:1.3rem;border-radius:50%;border:2px solid var(--gold);flex:none}
.opt.sel{background:rgba(255,209,102,.3);border-color:var(--gold);font-weight:700}
.opt.sel .dot{background:var(--gold);box-shadow:inset 0 0 0 .2rem #5b1432}
.opt.mine.sel{background:rgba(95,214,138,.3);border-color:var(--ok)}
.opt.mine.sel .dot{background:var(--ok);border-color:var(--ok)}
.opt.partner{border-style:dashed;border-color:var(--pink)}
.opt.partner .dot{border-color:var(--pink)}
.opt.partner.sel{background:rgba(255,143,177,.25)}
.opt.partner.sel .dot{background:var(--pink)}
.opt[disabled]{opacity:.4;cursor:not-allowed}
.hint{font-size:.95rem;color:var(--gold);margin:.5rem 0;text-align:center}
.alert{background:rgba(255,80,80,.2);border:2px solid var(--bad);border-radius:.9rem;padding:.7rem;margin:.6rem 0;text-align:center;font-weight:700}
.info{background:rgba(255,209,102,.18);border:1px solid var(--gold);border-radius:.9rem;padding:.7rem;margin:.6rem 0;text-align:center}
.done-box{text-align:center;padding:1.2rem}
.done-box .big{font-size:2.2rem;color:var(--ok);font-weight:800}
.barbot{position:sticky;bottom:0;z-index:4;padding:1.4rem 0 .4rem;background:linear-gradient(transparent,#2a0a1b 35%)}
.sum{text-align:center;font-size:.95rem;margin-bottom:.1rem}
.stage{text-align:center;padding:3rem .5rem}
.stage h1{font-size:2.6rem}
.stage .emoji{font-size:4rem}
.big2{font:1.5rem Georgia,serif;color:#fff;margin:.6rem 0}
.cd{font:900 8rem Georgia,serif;color:var(--gold);text-align:center;padding:4rem 0;animation:pop .7s ease-out}
.cd.txt{font-size:2.8rem;padding:6rem 0}
@keyframes pop{0%{transform:scale(2);opacity:0}50%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:20;padding:1rem}
#modal.on{display:flex}
.mbox{background:#3b0f25;border:2px solid var(--gold);border-radius:1.1rem;padding:1.2rem;width:100%;max-width:26rem;white-space:pre-line;font-size:1.1rem}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#000d;padding:.7rem 1.2rem;border-radius:2rem;display:none;z-index:30;max-width:90vw;text-align:center}
#conn{font-size:.75rem}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const uid=p=>p+Math.random().toString(36).slice(2,9);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}
function ask(msg,ok,cancel){return new Promise(res=>{const m=$('#modal');
 m.innerHTML='<div class="mbox"><p>'+esc(msg)+'</p><button class="btn" id="mYes">'+esc(ok||'Conferma')+'</button><button class="btn ghost" id="mNo">'+esc(cancel||'Annulla')+'</button></div>';
 m.classList.add('on');const close=v=>{m.classList.remove('on');m.innerHTML='';res(v)};
 $('#mYes').onclick=()=>close(true);$('#mNo').onclick=()=>close(false);$('#mYes').focus()})}
function alertBox(msg){return new Promise(res=>{const m=$('#modal');
 m.innerHTML='<div class="mbox"><p>'+esc(msg)+'</p><button class="btn" id="mOk">OK</button></div>';m.classList.add('on');
 $('#mOk').onclick=()=>{m.classList.remove('on');m.innerHTML='';res()};$('#mOk').focus()})}
function cleanSession(s){return String(s||'').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'')||'serata'}
function cleanUrl(u){
 u=String(u||'').trim().replace(/\/+$/,'');
 if(u&&!/^https?:\/\//i.test(u))u='https://'+u;
 return u}

/* ---------- database (Firebase REST o locale) ---------- */
let cfg={session:'',url:''};
const DB={
 local(){return !cfg.url},
 root(){return cleanUrl(cfg.url)+'/piatto/'+cleanSession(cfg.session)},
 lkey(){return 'ps_local_'+cleanSession(cfg.session)},
 u(path){return this.root()+(path?'/'+path:'')+'.json'},
 async get(path){
  if(this.local()){let n=LS.get(this.lkey(),{});for(const p of path.split('/').filter(Boolean)){if(n==null||typeof n!=='object')return null;n=n[p]}return n==null?null:n}
  const r=await fetch(this.u(path),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()},
 async set(path,val){
  if(this.local()){const parts=path.split('/').filter(Boolean);let t=LS.get(this.lkey(),{}),n=t;
   for(let i=0;i<parts.length-1;i++){if(n[parts[i]]==null||typeof n[parts[i]]!=='object')n[parts[i]]={};n=n[parts[i]]}
   if(val===null)delete n[parts[parts.length-1]];else n[parts[parts.length-1]]=val;
   if(!LS.set(this.lkey(),t))throw new Error('memoria piena');return}
  const r=await fetch(this.u(path),val===null?{method:'DELETE'}:{method:'PUT',body:JSON.stringify(val)});if(!r.ok)throw new Error('HTTP '+r.status)},
 /* scrive solo se la chiave non esiste ancora; true = scritto */
 async setIfAbsent(path,val){
  if(this.local()){if(await this.get(path)!=null)return false;await this.set(path,val);return true}
  try{const r=await fetch(this.u(path),{method:'PUT',body:JSON.stringify(val),headers:{'if-match':'null_etag'}});
   if(r.status===412)return false;if(!r.ok)throw new Error('HTTP '+r.status);return true}
  catch(e){if(!(e instanceof TypeError))throw e;
   if(await this.get(path)!=null)return false;await this.set(path,val);return true}}
};

/* ---------- stato ---------- */
let S={participants:{},dishes:{},votes:{},state:{},settings:{},phase:'prep'},lastRaw='',polling=false,timer=null;
let me=null,cur=null,pending=null,page=null;      /* page (preparazione): intro | pick | wait */
let draft={init:false,own:null,name:'',partner:null};
const cd={rev:null,running:false};
const sel={},IMG={};
function flagsKey(){return 'ps_flags_'+cleanSession(cfg.session)+'_'+(me?me.id:'')}
let flags={seen:{},cancel:{}};

const dlist=()=>Object.entries(S.dishes).map(([id,d])=>({id,num:Number(d.num)||0,name:d.name||'',owner:d.owner||'',v:d.v})).sort((a,b)=>a.num-b.num);
const plist=()=>Object.entries(S.participants).map(([id,p])=>({id,name:(p&&p.name)||'?'})).sort((a,b)=>a.name.localeCompare(b.name));
const myDish=()=>dlist().find(d=>d.owner===me.id);
const myP=()=>S.participants[me.id]||{};
const myPartnerDish=()=>{const id=myP().pdish;return id&&S.dishes[id]?dlist().find(d=>d.id===id):null};
const myVote=d=>(S.votes[d]||{})[me.id];
const partnerOn=()=>!S.settings||S.settings.partner!==false;
const isGame=()=>S.phase==='game';
const typing=()=>document.activeElement&&document.activeElement.tagName==='INPUT';
function liveDish(){const st=S.state||{};return isGame()&&(st.view==='dish'||st.view==='result')&&st.dishId&&S.dishes[st.dishId]?st.dishId:null}
function readyCount(){const ps=plist(),own=new Set(dlist().filter(d=>d.owner&&d.name).map(d=>d.owner));return{ok:ps.filter(p=>own.has(p.id)).length,tot:ps.length}}

async function poll(){
 if(polling||!me)return;polling=true;
 try{const c=(await DB.get('core'))||{};const raw=JSON.stringify(c);
  if(raw!==lastRaw){lastRaw=raw;S={participants:c.participants||{},dishes:c.dishes||{},votes:c.votes||{},state:c.state||{},settings:c.settings||{},phase:c.phase==='game'?'game':'prep'};onData()}}
 catch(e){const c=$('#conn');if(c)c.textContent='⚠️ offline'}
 polling=false}
function onData(){
 if(!S.participants[me.id]){logout('Sei stato rimosso dalla serata: rientra con il tuo nome.');return}
 cur=liveDish();
 /* rileva voti cancellati dalla dashboard */
 dlist().forEach(d=>{if(myVote(d.id)){flags.seen[d.id]=true}else if(flags.seen[d.id]){flags.seen[d.id]=false;flags.cancel[d.id]=true;delete sel[d.id]}});
 LS.set(flagsKey(),flags);
 const st=S.state||{};
 if(isGame()&&st.view==='countdown'&&st.rev!==cd.rev){cd.rev=st.rev;runCountdown();return}
 if(cd.running)return;
 if(!isGame()&&typing())return;
 render()}
function enter(){
 flags=LS.get(flagsKey(),{seen:{},cancel:{}});page=null;draft={init:false,own:null,name:'',partner:null};
 $('#app').innerHTML='<div class="card" style="text-align:center">⏳ Collegamento in corso…</div>';
 polling=false;poll();clearInterval(timer);timer=setInterval(poll,2000)}
function logout(msg){clearInterval(timer);localStorage.removeItem('ps_me');me=null;lastRaw='';renderLogin({session:cfg.session,url:cfg.url});if(msg)toast(msg)}

/* ---------- immagini ---------- */
function imgSrc(d){const c=IMG[d.id];if(c&&c.v===d.v)return c.data;
 IMG[d.id]={v:d.v,data:'',loading:true};
 DB.get('img/'+d.id).then(r=>{IMG[d.id]={v:d.v,data:(r&&r.data)||''};if(!cd.running&&!typing())render()}).catch(()=>{delete IMG[d.id]});
 return''}

/* ---------- accesso ---------- */
function renderLogin(prefill){
 const f=prefill||{};
 $('#app').innerHTML='<h1>🍽️ Piatto Segreto</h1><div class="card"><div class="hint" style="margin-top:0">Entra nella serata</div>'+
 '<label for="fS">Codice sessione</label><input id="fS" value="'+esc(f.session)+'" autocapitalize="off" autocomplete="off">'+
 '<label for="fU">URL database Firebase (vuoto = prova locale)</label><input id="fU" type="url" value="'+esc(f.url)+'" autocapitalize="off" autocomplete="off">'+
 '<label for="fN">Il tuo nome</label><input id="fN" maxlength="30" value="'+esc(f.name)+'" autocomplete="off">'+
 '<button class="btn" id="goBtn">Entra 🎉</button></div><div id="sure"></div>';
 $('#goBtn').onclick=login;$('#fN').onkeydown=e=>{if(e.key==='Enter')login()}}
async function login(){
 const s=cleanSession($('#fS').value),u=cleanUrl($('#fU').value),n=$('#fN').value.trim().replace(/\s+/g,' ');
 if(!n)return toast('Scrivi il tuo nome');
 cfg={session:s,url:u};LS.set('ps_vcfg',cfg);
 let ps;try{ps=(await DB.get('core/participants'))||{}}catch(e){return toast('Impossibile collegarsi al database')}
 const ex=Object.entries(ps).find(([id,p])=>p&&p.name&&p.name.toLowerCase()===n.toLowerCase());
 if(ex){pending={id:ex[0],name:ex[1].name};
  $('#sure').innerHTML='<div class="card"><div class="info">Esiste già <b>'+esc(ex[1].name)+'</b>. Sei tu?</div><button class="btn" id="yes">Sì, sono io</button><button class="btn ghost" id="no">No, scelgo un altro nome</button></div>';
  $('#yes').onclick=()=>finish(pending);$('#no').onclick=()=>{$('#sure').innerHTML='';$('#fN').value='';$('#fN').focus()};return}
 const p={id:uid('p'),name:n};
 try{await DB.set('core/participants/'+p.id,{name:n,t:Date.now()})}catch(e){return toast('Registrazione non riuscita: '+e.message)}
 finish(p)}
function finish(p){me={id:p.id,name:p.name,session:cleanSession(cfg.session),url:cleanUrl(cfg.url)};LS.set('ps_me',me);cur=null;lastRaw='';enter()}

/* ---------- router ---------- */
function header(){return '<div class="top"><span>👤 <b>'+esc(me.name)+'</b> · <span id="conn">'+(DB.local()?'💾 locale':'☁️ online')+'</span></span><button class="lnk" id="exit">Esci</button></div>'}
function bindExit(){const e=$('#exit');if(e)e.onclick=async()=>{if(await ask('Uscire da questo dispositivo? Le tue scelte e i voti già dati restano validi.','Esci'))logout()}}
function render(){
 if(!me)return;
 if(isGame())return renderGame();
 const m=myDish();
 if(!page)page=m&&m.name?'wait':'intro';
 if(page==='wait'&&!(m&&m.name))page='intro';
 if(page==='intro')return renderIntro();
 if(page==='pick')return renderPick();
 return renderWait()}

/* ---------- 1 · Introduzione ---------- */
function renderIntro(){
 const n=dlist().length;
 $('#app').innerHTML=header()+'<h1>🍽️ Piatto Segreto</h1><div class="card" style="text-align:center">'+
  '<div class="big2">Seleziona il tuo piatto'+(partnerOn()?' e, se presente, anche quello del tuo partner.':'.')+'</div>'+
  '<p>Poi dai un nome al tuo piatto e premi <b>Conferma</b>.</p>'+
  (n?'<button class="btn" id="goPick">Ho capito, avanti ➡️</button>':'<div class="info">⏳ L\'organizzatore sta caricando i piatti…</div>')+'</div>';
 bindExit();
 const g=$('#goPick');if(g)g.onclick=()=>{page='pick';draft.init=false;render();window.scrollTo(0,0)}}

/* ---------- 2 · Scelta piatti ---------- */
function renderPick(){
 const ds=dlist(),pOn=partnerOn();
 if(!draft.init){const m=myDish(),pd=myPartnerDish();draft={init:true,own:m?m.id:null,name:m?m.name:'',partner:pOn&&pd?pd.id:null}}
 if(draft.own&&!S.dishes[draft.own])draft.own=null;
 if(draft.partner&&(!S.dishes[draft.partner]||!pOn))draft.partner=null;
 let h=header()+'<h2>Seleziona i piatti</h2><div class="info">Tocca <b>«È il mio piatto»</b> sotto il tuo e dagli un nome.'+(pOn?'<br>Se il tuo partner ha cucinato, tocca <b>«È il piatto del mio partner»</b> sotto il suo.':'')+'</div>';
 if(!ds.length)h+='<div class="card" style="text-align:center">⏳ Nessun piatto caricato.</div>';
 h+=ds.map(d=>{
  const isOwn=draft.own===d.id,isP=draft.partner===d.id,taken=d.owner&&d.owner!==me.id;
  let b='<div class="card'+(isOwn?' own':isP?' pt':'')+'"><span class="num">Piatto n° '+d.num+'</span>'+
   '<img class="img pimg" alt="Foto del piatto n° '+d.num+'" src="'+esc(imgSrc(d))+'">';
  if(taken&&!isOwn)b+='<div class="hint">🔒 Già scelto da un altro giocatore</div>';
  else b+='<button class="opt mine'+(isOwn?' sel':'')+'" data-own="'+esc(d.id)+'" aria-pressed="'+isOwn+'"><span class="dot"></span>🍳 È il mio piatto</button>';
  if(isOwn)b+='<label for="nin">Nome del tuo piatto</label><input id="nin" maxlength="60" value="'+esc(draft.name)+'" placeholder="Es. Lasagne della nonna" autocomplete="off">';
  if(pOn)b+='<button class="opt partner'+(isP?' sel':'')+'" data-partner="'+esc(d.id)+'" aria-pressed="'+isP+'"'+(isOwn?' disabled':'')+'><span class="dot"></span>💑 È il piatto del mio partner</button>';
  return b+'</div>'}).join('');
 h+='<div class="barbot"><div class="sum" id="sum" aria-live="polite"></div><button class="btn" id="okBtn" disabled>✅ Conferma</button>'+
  (myDish()?'<button class="btn ghost" id="cancelPick">Annulla modifiche</button>':'')+'</div>';
 $('#app').innerHTML=h;bindExit();
 document.querySelectorAll('[data-own]').forEach(b=>b.onclick=()=>{
  const id=b.dataset.own;draft.own=draft.own===id?null:id;
  if(draft.own&&draft.partner===draft.own)draft.partner=null;
  renderPick();const i=$('#nin');if(i)i.focus({preventScroll:true})});
 document.querySelectorAll('[data-partner]').forEach(b=>b.onclick=()=>{
  if(b.disabled)return;const id=b.dataset.partner;if(id===draft.own)return;
  draft.partner=draft.partner===id?null:id;renderPick()});
 const i=$('#nin');if(i){i.oninput=()=>{draft.name=i.value;updBar()};i.onkeydown=e=>{if(e.key==='Enter')i.blur()}}
 $('#okBtn').onclick=savePick;
 const c=$('#cancelPick');if(c)c.onclick=()=>{draft.init=false;page='wait';render()};
 updBar()}
function updBar(){
 const ds=dlist(),o=ds.find(d=>d.id===draft.own),p=ds.find(d=>d.id===draft.partner),nm=draft.name.trim();
 let t;
 if(!o)t='⚠️ Seleziona il tuo piatto';
 else if(!nm)t='✍️ Dai un nome al tuo piatto (n° '+o.num+')';
 else t='🍳 Mio: n° '+o.num+' «'+esc(nm)+'»'+(partnerOn()?' · 💑 Partner: '+(p?'n° '+p.num:'nessuno'):'');
 $('#sum').innerHTML=t;$('#okBtn').disabled=!(o&&nm)}
async function savePick(){
 const own=draft.own,name=draft.name.trim().replace(/\s+/g,' '),partner=partnerOn()?draft.partner:null;
 if(!own||!S.dishes[own])return alertBox('⛔ Devi selezionare il tuo piatto.');
 if(!name)return alertBox('⛔ Dai un nome al tuo piatto.');
 if(partner&&partner===own)return alertBox('⛔ Il tuo piatto e quello del partner non possono essere lo stesso.');
 const o=dlist().find(d=>d.id===own),p=partner?dlist().find(d=>d.id===partner):null;
 if(!await ask('Il tuo piatto: n° '+o.num+' «'+name+'»'+(partnerOn()?'\nPiatto del partner: '+(p?'n° '+p.num:'nessuno'):'')+'\n\nConfermi?','Sì, conferma','Controllo ancora'))return;
 try{
  lastRaw='';polling=false;await poll();
  if(isGame())return alertBox('⛔ La sfida è già iniziata: le scelte non sono più modificabili.');
  const mine=myDish();
  if(!mine||mine.id!==own){
   const okc=await DB.setIfAbsent('core/dishes/'+own+'/owner',me.id);
   if(!okc){draft.own=null;lastRaw='';polling=false;await poll();return alertBox('⛔ Questo piatto è appena stato scelto da un altro giocatore. Controlla di aver selezionato quello giusto.')}
   if(mine){await DB.set('core/dishes/'+mine.id+'/name',null);await DB.set('core/dishes/'+mine.id+'/owner',null)}}
  await DB.set('core/dishes/'+own+'/name',name);
  await DB.set('core/participants/'+me.id+'/pdish',partner||null);
  toast('Scelte salvate ✅');page='wait';draft.init=false;lastRaw='';polling=false;await poll();render();window.scrollTo(0,0)}
 catch(e){toast('Salvataggio non riuscito: '+e.message)}}

/* ---------- 3 · Attesa avvio ---------- */
function renderWait(){
 const m=myDish(),p=partnerOn()?myPartnerDish():null,rc=readyCount();
 $('#app').innerHTML=header()+'<div class="card done-box"><div class="big">✅ Fatto!</div>'+
  '<p>Il tuo piatto: <b>n° '+m.num+' «'+esc(m.name)+'»</b></p>'+
  (partnerOn()?'<p>Piatto del partner: <b>'+(p?'n° '+p.num:'nessuno')+'</b></p>':'')+'</div>'+
  '<div class="info">⏳ Attendi che l\'organizzatore avvii il gioco.<br>Giocatori pronti: <b>'+rc.ok+'/'+rc.tot+'</b></div>'+
  '<div class="hint">🤫 Durante il gioco vota normalmente anche sul tuo piatto'+(partnerOn()?' e su quello del partner':'')+': quel voto non conta, serve solo a non farti scoprire!</div>'+
  '<button class="btn ghost" id="edit">✏️ Modifica le mie scelte</button>';
 bindExit();$('#edit').onclick=()=>{page='pick';draft.init=false;render();window.scrollTo(0,0)}}

/* ---------- Gara ----------
   Schermata IDENTICA per tutti (autore e partner compresi): chi sbircia non nota differenze.
   Il voto dell'autore e del partner viene annullato dalla dashboard in fase di calcolo. */
function runCountdown(){
 cd.running=true;let i=0;const seq=['3','2','1','Buon appetito! 🍽️'];
 const step=()=>{
  if(!me||!isGame()){cd.running=false;return render()}
  if(i<seq.length){$('#app').innerHTML='<div class="cd'+(i===3?' txt':'')+'" aria-live="assertive">'+seq[i]+'</div>';i++;setTimeout(step,i===4?2200:1000)}
  else{cd.running=false;render()}};
 step()}
const voteLabel=v=>(S.participants[v]?S.participants[v].name:'(rimosso)')+(v===me.id?' (te stesso)':'');
function renderGame(){
 const st=S.state||{},id=liveDish(),d=id?dlist().find(x=>x.id===id):null;
 let h=header();
 if(!d){
  if(st.view==='ready')h+='<div class="stage"><div class="emoji">🍽️</div><h1>Siamo pronti?</h1><div class="big2">Il gioco sta per partire.</div></div>';
  else if(st.view==='countdown')h+='<div class="cd txt">Buon appetito! 🍽️</div>';
  else{const msg=st.view==='reveal'?'📺 Si svelano gli autori: guarda lo schermo!':st.view==='final'?'🏆 Classifica finale in corso: guarda lo schermo!':'⏳ Attendi: il prossimo piatto comparirà qui quando sarà mostrato sullo schermo.';
   h+='<div class="card" style="text-align:center;font-size:1.2rem">'+msg+'</div>'}
  $('#app').innerHTML=h;bindExit();return}
 h+='<div class="card"><span class="num">Piatto n° '+d.num+'</span>'+(d.name?'<div class="name">'+esc(d.name)+'</div>':'')+'<img class="img" alt="Foto del piatto n° '+d.num+'" src="'+esc(imgSrc(d))+'"></div>';
 const v=myVote(d.id);
 if(v)h+='<div class="card done-box"><div class="big">✅ Voto confermato</div><p>Hai scelto <b>'+esc(voteLabel(v))+'</b>.<br>Il voto è definitivo. Attendi il prossimo piatto!</p></div>';
 else if(st.view==='result')h+='<div class="info">⏱️ La votazione di questo piatto è chiusa.</div>';
 else{
  if(flags.cancel[d.id])h+='<div class="alert">🔄 Votazione annullata: devi votare di nuovo questo piatto.</div>';
  h+='<div class="card"><h2 style="margin-top:0">Chi ha preparato questo piatto?</h2>'+
  plist().map(p=>'<button class="opt'+(sel[d.id]===p.id?' sel':'')+'" data-p="'+esc(p.id)+'" aria-pressed="'+(sel[d.id]===p.id)+'"><span class="dot"></span>'+esc(p.name)+(p.id===me.id?' (io)':'')+'</button>').join('')+
  '<button class="btn" id="conf"'+(sel[d.id]?'':' disabled')+'>CONFERMA VOTO</button></div>'}
 $('#app').innerHTML=h;bindExit();
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sel[d.id]=b.dataset.p;render()});
 const c=$('#conf');if(c)c.onclick=()=>confirmVote(d)}
async function confirmVote(d){
 const t=sel[d.id];if(!t||!S.participants[t])return;
 if(!await ask('Piatto n° '+d.num+(d.name?' – '+d.name:'')+'\n\nVoti: '+voteLabel(t)+'\n\nDopo la conferma il voto è DEFINITIVO.','Sì, conferma','Controllo ancora'))return;
 lastRaw='';polling=false;await poll();
 if(liveDish()!==d.id||(S.state||{}).view!=='dish'){toast('⛔ Questo piatto non è più in votazione');return render()}
 try{const done=await DB.setIfAbsent('core/votes/'+d.id+'/'+me.id,t);
  if(!done)toast('Hai già votato questo piatto');
  else{flags.seen[d.id]=true;delete flags.cancel[d.id];LS.set(flagsKey(),flags);delete sel[d.id]}
  lastRaw='';polling=false;await poll();render()}
 catch(e){toast('Voto non inviato: '+e.message)}}

/* ---------- avvio ---------- */
(function(){
 const p=new URLSearchParams(location.search),saved=LS.get('ps_vcfg',{session:'',url:''});
 cfg={session:p.get('s')||saved.session||'',url:p.has('db')?p.get('db'):(p.get('s')?'':saved.url||'')};
 const m=LS.get('ps_me',null);
 if(m&&m.session===cleanSession(cfg.session)&&m.url===cleanUrl(cfg.url)){me=m;enter();return}
 renderLogin({session:cfg.session,url:cfg.url,name:m?m.name:''})})();
</script>
